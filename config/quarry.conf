# ==============================================================================
# Quarry Engine Configuration File (quarry.conf)
# ==============================================================================

[system]
# Number of parallel morsel worker threads in the POSIX thread pool
# Default 0 automatically sets to physical core count
worker_threads = 8

# Execution scheduling quantum (rows per morsel chunk)
morsel_size = 2048

# Maximum memory limit for the database instance in megabytes
max_memory_mb = 8192

[storage]
# Standard columnar chunk capacity (rows per DataChunk)
chunk_capacity = 2048

# Default query-scoped bump arena block size in bytes (64 KB)
arena_block_size = 65536

# Automatic compression codec selection (auto, bitpack, for, rle, dict)
compression_policy = auto

# Cache line alignment boundary in bytes (64 bytes for AVX2/AVX-512/NEON)
cache_line_alignment = 64

[jit]
# Enable LLVM fused single-loop JIT pipeline compilation
enable_jit = true

# Row count threshold to trigger native JIT kernel compilation
jit_threshold_rows = 1000

# LLVM optimization level (0, 1, 2, 3)
llvm_opt_level = 3

# Cache capacity for compiled native function pointers (LRU)
kernel_cache_capacity = 128

[vector]
# Default distance metric for vector similarity (l2, cosine, dot, l1)
default_metric = l2

# Hierarchical Navigable Small World (HNSW) index parameters
hnsw_M = 16
hnsw_ef_construction = 64
hnsw_ef_search = 32

# Inverted File Index (IVF) default Voronoi centroid count
ivf_nlist = 128
ivf_nprobe = 8

[server]
# Embedded HTTP daemon listening port
http_port = 8080

# Bind network interface address
http_host = 0.0.0.0

# Cross-Origin Resource Sharing (CORS) header configuration
cors_allow_origin = *
